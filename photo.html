<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photo</title>
    <link rel="stylesheet" href="styles.css?v=7" />
  </head>
  <body class="photo-page">
    <header class="site-header">
      <div class="container">
        <h1 class="site-title" id="site-title">My Photography</h1>
        <nav class="top-nav" id="top-nav"></nav>
      </div>
    </header>

    <main class="container" id="main-content">
    	<h2 class="page-title" id="photo-title">Photo</h2>
      <p class="page-subtitle" id="photo-subtitle"></p>

      <div class="photo-frame">
        <div class="photo-stage">
          <button type="button" class="photo-nav photo-nav-prev" id="photo-prev" aria-label="Previous photo">
            <span aria-hidden="true">‹</span>
          </button>
          <img id="photo-image" src="" alt="" />
          <button type="button" class="photo-nav photo-nav-next" id="photo-next" aria-label="Next photo">
            <span aria-hidden="true">›</span>
          </button>
        </div>
        <div class="photo-caption" id="photo-caption"></div>
      </div>

      <p>
        <a class="muted" id="back-link" href="works.html">Back</a>
      </p>
    </main>

    <script src="site-config.js"></script>
    <script src="app.js?v=9"></script>
    <script>
      window.PortfolioApp.initHeader();
      window.PortfolioApp.loadPhotoPage();
    </script>
  </body>
</html>
